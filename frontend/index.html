<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Trading Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1"></script>
    <style>
      body { background: #0b1220; color: #e2e8f0; }
      .card { background: linear-gradient(145deg, #111827, #0f172a); border: 1px solid #1f2937; }
    </style>
  </head>
  <body class="min-h-screen font-sans">
    <div class="p-4 md:p-6 space-y-4">
      <header class="flex items-center justify-between">
        <h1 class="text-2xl font-semibold">Crypto Trading Intelligence Terminal</h1>
        <div class="text-sm text-slate-400" id="connectionStatus">Connecting...</div>
      </header>

      <section class="grid grid-cols-1 xl:grid-cols-3 gap-4">
        <div class="card rounded-xl p-4 xl:col-span-2">
          <div class="flex justify-between mb-2"><h2 class="text-lg font-medium">Live Candlestick Chart</h2><span id="symbol" class="text-slate-400"></span></div>
          <canvas id="candleChart" height="120"></canvas>
        </div>

        <div class="card rounded-xl p-4 space-y-4">
          <h2 class="text-lg font-medium">Signal Strength</h2>
          <div class="text-3xl font-bold" id="signalLabel">Neutral</div>
          <div class="w-full h-4 bg-slate-800 rounded overflow-hidden">
            <div id="signalGauge" class="h-4 bg-cyan-400 transition-all duration-500" style="width:0%"></div>
          </div>
          <div id="signalPct" class="text-sm text-slate-300">0%</div>

          <h3 class="text-md font-medium pt-3">Indicator Breakdown</h3>
          <div id="indicators" class="grid grid-cols-2 gap-2 text-sm"></div>
        </div>
      </section>

      <section class="grid grid-cols-1 xl:grid-cols-3 gap-4">
        <div class="card rounded-xl p-4 xl:col-span-2">
          <h2 class="text-lg font-medium mb-2">Trade History</h2>
          <div class="overflow-auto max-h-72">
            <table class="w-full text-sm">
              <thead class="text-slate-400 sticky top-0 bg-slate-900">
                <tr><th class="text-left p-2">Time</th><th class="text-left p-2">Side</th><th class="text-right p-2">Entry</th><th class="text-right p-2">Exit</th><th class="text-right p-2">PnL</th></tr>
              </thead>
              <tbody id="tradeTable"></tbody>
            </table>
          </div>
        </div>

        <div class="card rounded-xl p-4 space-y-3">
          <h2 class="text-lg font-medium">Performance</h2>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div class="text-slate-400">Equity</div><div id="equity" class="text-right">-</div>
            <div class="text-slate-400">Win Rate</div><div id="winRate" class="text-right">-</div>
            <div class="text-slate-400">Max Drawdown</div><div id="maxDD" class="text-right">-</div>
            <div class="text-slate-400">Profit Factor</div><div id="profitFactor" class="text-right">-</div>
            <div class="text-slate-400">Signal Accuracy</div><div id="accuracy" class="text-right">-</div>
            <div class="text-slate-400">Trades</div><div id="totalTrades" class="text-right">-</div>
          </div>
        </div>
      </section>

      <section class="card rounded-xl p-4">
        <h2 class="text-lg font-medium mb-2">Equity Curve</h2>
        <canvas id="equityChart" height="90"></canvas>
      </section>
    </div>

    <script>
      const connectionStatus = document.getElementById('connectionStatus');
      const signalGauge = document.getElementById('signalGauge');
      const signalLabel = document.getElementById('signalLabel');
      const signalPct = document.getElementById('signalPct');
      const indicators = document.getElementById('indicators');
      const symbolEl = document.getElementById('symbol');
      const tradeTable = document.getElementById('tradeTable');

      const candleData = [];
      const buySellMarkers = [];

      const candleChart = new Chart(document.getElementById('candleChart').getContext('2d'), {
        data: {
          datasets: [
            {
              type: 'candlestick',
              label: 'Price',
              data: candleData,
              color: { up: '#34d399', down: '#f87171', unchanged: '#cbd5e1' }
            },
            {
              type: 'scatter',
              label: 'Signals',
              data: buySellMarkers,
              pointRadius: 4,
              backgroundColor: ctx => ctx.raw.side === 'buy' ? '#22c55e' : '#ef4444'
            }
          ]
        },
        options: {
          responsive: true,
          animation: { duration: 280 },
          plugins: { legend: { labels: { color: '#94a3b8' } } },
          scales: {
            x: { type: 'time', ticks: { color: '#64748b' }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } }
          }
        }
      });

      const equityChart = new Chart(document.getElementById('equityChart').getContext('2d'), {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Equity', data: [], borderColor: '#38bdf8', tension: 0.25, fill: false }] },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#94a3b8' } } },
          scales: {
            x: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } }
          }
        }
      });

      function formatNum(value) { return Number(value).toFixed(2); }

      function connect() {
        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${protocol}://${location.host}/ws/frontend`);

        ws.onopen = () => { connectionStatus.textContent = 'Connected'; connectionStatus.className = 'text-emerald-400 text-sm'; ws.send('ready'); };
        ws.onclose = () => {
          connectionStatus.textContent = 'Reconnecting...';
          connectionStatus.className = 'text-amber-400 text-sm';
          setTimeout(connect, 2000);
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);

          if (msg.type === 'hello') {
            symbolEl.textContent = msg.symbol;
          }

          if (msg.type === 'new_candle' && msg.timeframe === '1m') {
            const c = msg.data;
            candleData.push({ x: new Date(c.close_time), o: c.open, h: c.high, l: c.low, c: c.close });
            if (candleData.length > 250) candleData.shift();
            candleChart.update('none');
          }

          if (msg.type === 'signal') {
            const s = msg.data;
            signalLabel.textContent = s.label;
            signalPct.textContent = `${formatNum(s.strength)}%`;
            signalGauge.style.width = `${Math.min(100, s.strength)}%`;
            signalGauge.className = `h-4 transition-all duration-500 ${s.score >= 0 ? 'bg-emerald-400' : 'bg-rose-400'}`;

            indicators.innerHTML = '';
            Object.entries(s.indicator_breakdown).forEach(([k, v]) => {
              const el = document.createElement('div');
              el.className = 'flex justify-between bg-slate-900 rounded px-2 py-1';
              el.innerHTML = `<span class="text-slate-400">${k}</span><span class="${v >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${formatNum(v)}</span>`;
              indicators.appendChild(el);
            });

            const last = candleData[candleData.length - 1];
            if (last && ['Buy', 'Strong Buy', 'Sell', 'Strong Sell'].includes(s.label)) {
              buySellMarkers.push({ x: last.x, y: last.c, side: s.score > 0 ? 'buy' : 'sell' });
              if (buySellMarkers.length > 70) buySellMarkers.shift();
              candleChart.update('none');
            }
          }

          if (msg.type === 'trade_update') {
            const t = msg.data;
            const row = document.createElement('tr');
            row.innerHTML = `<td class="p-2">${new Date(t.exit_time).toLocaleTimeString()}</td>
                             <td class="p-2 ${t.side === 'long' ? 'text-emerald-400' : 'text-rose-400'}">${t.side}</td>
                             <td class="p-2 text-right">${formatNum(t.entry_price)}</td>
                             <td class="p-2 text-right">${formatNum(t.exit_price)}</td>
                             <td class="p-2 text-right ${t.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${formatNum(t.pnl)}</td>`;
            tradeTable.prepend(row);
            while (tradeTable.children.length > 100) tradeTable.removeChild(tradeTable.lastChild);
          }

          if (msg.type === 'metrics') {
            const m = msg.data;
            document.getElementById('equity').textContent = formatNum(m.equity);
            document.getElementById('winRate').textContent = `${formatNum(m.win_rate)}%`;
            document.getElementById('maxDD').textContent = `${formatNum(m.max_drawdown)}%`;
            document.getElementById('profitFactor').textContent = Number.isFinite(m.profit_factor) ? formatNum(m.profit_factor) : '∞';
            document.getElementById('accuracy').textContent = `${formatNum(m.rolling_accuracy)}% (${m.signal_accuracy_samples})`;
            document.getElementById('totalTrades').textContent = m.total_trades;

            equityChart.data.labels = m.equity_curve.map((_, i) => i + 1);
            equityChart.data.datasets[0].data = m.equity_curve;
            equityChart.update('none');
          }
        };
      }

      connect();
    </script>
  </body>
</html>
